<line x1="990" y1="336" x2="990" y2="365" stroke="#366B9A" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<rect x="822" y="367" width="336" height="117" rx="6" fill="#E7F1F8" stroke="#366B9A" stroke-width="1.3"/>
<text x="845" y="401" font-size="23" fill="#26313B" font-weight="bold" text-anchor="start">Draft statement</text>
<text x="845" y="439" font-size="21" fill="#26313B" font-weight="normal" text-anchor="start">A chunk keeps its source</text>
<text x="845" y="469" font-size="21" fill="#26313B" font-weight="normal" text-anchor="start">line range. [1]</text>
