<text x="464" y="492" font-size="22" fill="#26313B" font-weight="bold" text-anchor="start">Text payload</text>
<text x="464" y="537" font-size="22" fill="#26313B" font-weight="normal" text-anchor="start">Each chunk retains</text>
<text x="464" y="572" font-size="22" fill="#26313B" font-weight="normal" text-anchor="start">its source line range.</text>
<rect x="442" y="650" width="301" height="93" rx="6" fill="#FFFFFF" stroke="#587B4D" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="592" y="683" font-size="23" fill="#587B4D" font-weight="bold" text-anchor="middle">One linked record</text>
<text x="592" y="718" font-size="20" fill="#57616D" font-weight="normal" text-anchor="middle">text + source coordinates</text>
<line x1="592" y1="421" x2="592" y2="455" stroke="#587B4D" stroke-width="1.7" marker-end="url(#arrow-green)"/>
<line x1="592" y1="605" x2="592" y2="648" stroke="#587B4D" stroke-width="1.7" marker-end="url(#arrow-green)"/>
</g>
