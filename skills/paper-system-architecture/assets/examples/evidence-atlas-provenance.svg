<rect x="74" y="367" width="277" height="107" rx="4" fill="#EAF2E2" stroke="#587B4D" stroke-width="1.3"/>
<text x="86" y="309" font-size="18" fill="#929DA8" font-weight="normal" text-anchor="start">01</text>
<text x="119" y="309" font-size="18" fill="#26313B" font-weight="normal" text-anchor="start">A source has a stable ID.</text>
<text x="86" y="361" font-size="18" fill="#929DA8" font-weight="normal" text-anchor="start">02</text>
<text x="119" y="361" font-size="18" fill="#26313B" font-weight="normal" text-anchor="start">Text is split into chunks.</text>
<text x="86" y="413" font-size="18" fill="#929DA8" font-weight="normal" text-anchor="start">03</text>
<text x="119" y="413" font-size="18" fill="#26313B" font-weight="normal" text-anchor="start">Each chunk retains</text>
<text x="86" y="465" font-size="18" fill="#929DA8" font-weight="normal" text-anchor="start">04</text>
<text x="119" y="465" font-size="18" fill="#26313B" font-weight="normal" text-anchor="start">its source line range.</text>
