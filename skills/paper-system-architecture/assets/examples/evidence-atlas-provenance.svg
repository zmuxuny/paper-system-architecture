<text x="1260" y="481" font-size="23" fill="#26313B" font-weight="normal" text-anchor="start">A highlighted span</text>
<text x="1260" y="515" font-size="23" fill="#26313B" font-weight="normal" text-anchor="start">becomes a structured</text>
<text x="1260" y="549" font-size="23" fill="#26313B" font-weight="normal" text-anchor="start">evidence record.</text>
