<text x="1260" y="737" font-size="23" fill="#26313B" font-weight="normal" text-anchor="start">helps explain the</text>
<text x="1260" y="771" font-size="23" fill="#26313B" font-weight="normal" text-anchor="start">citation mechanism.</text>
