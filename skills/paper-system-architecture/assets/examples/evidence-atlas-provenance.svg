<text x="84" y="649" font-size="19" fill="#587B4D" font-weight="bold" text-anchor="start">Selected span: lines 3–4</text>
<text x="212" y="741" font-size="21" fill="#B58B54" font-weight="bold" text-anchor="middle">Preserve document identity</text>
</g>
