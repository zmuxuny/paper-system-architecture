<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#26313B" stroke-linejoin="round" stroke-linecap="round">
<title>Evidence Atlas: a citation is a traceable span</title>
<desc>Original illustrative document system with synthetic content.</desc>
